[project]
name = "compaction-engine"
version = "0.1.0"
description = "Context-Aware State Compaction Engine for Multi-Agent Agentic AI Systems"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "langchain-core>=0.3,<0.4",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3,<0.4"]
openai = ["langchain-openai>=0.2,<0.3"]
local = ["langchain-ollama>=0.2,<0.3"]
embeddings = ["sentence-transformers>=3.0,<4.0"]
langgraph = ["langgraph>=0.2,<0.3"]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<0.7",
    "mypy>=1.11,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compaction_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
mypy_path = "src"
